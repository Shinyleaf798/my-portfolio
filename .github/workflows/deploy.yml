name: Build and Deploy

on:
  # Manual trigger (click "Run workflow" on the Actions page).
  # Use this after pushing new content to the notes repo.
  workflow_dispatch:
  # Also build automatically when this repo (site code) is updated.
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      # Ensure target directories exist and are empty (Git doesn't track empty
      # folders, so if sample content was deleted, the folder may not exist
      # at all after checkout — mkdir -p covers that).
      - name: Prepare content directories
        run: |
          mkdir -p src/content/notes src/content/news
          rm -rf src/content/notes/* src/content/news/*

      # Pull the whole notes repo into a temp dir. It's organized internally
      # with notes/ and news/ subfolders.
      # continue-on-error: kept as a long-term safety net — if the notes repo
      # is ever renamed/deleted/temporarily unreachable, that shouldn't also
      # fail deployment of the site itself (About/Projects etc).
      - name: Checkout notes repo
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Shinyleaf798/my-note
          path: _notes-source
          # token: ${{ secrets.NOTES_REPO_TOKEN }}   # uncomment if private

      # Inject the notes repo's notes/ and news/ subfolders into the
      # matching content directories on the site.
      - name: Inject notes and news content
        run: |
          shopt -s nullglob dotglob
          notes_files=(_notes-source/notes/*)
          if [ ${#notes_files[@]} -gt 0 ]; then
            cp -r _notes-source/notes/. src/content/notes/
          else
            echo "Warning: no notes/ directory found (or empty) in notes repo"
          fi
          news_files=(_notes-source/news/*)
          if [ ${#news_files[@]} -gt 0 ]; then
            cp -r _notes-source/news/. src/content/news/
          else
            echo "Warning: no news/ directory found (or empty) in notes repo"
          fi
          rm -rf _notes-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro + Pagefind index)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
