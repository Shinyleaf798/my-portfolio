name: Build and Deploy

on:
  # 手动触发 (在 Actions 页面点 "Run workflow")。
  # 笔记独立仓库更新后, 来这里手动触发重新构建。
  workflow_dispatch:
  # 本仓库(网站代码)有更新时也自动构建
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 网站仓库
        uses: actions/checkout@v4

      # 确保目标目录存在并清空 (Git 不会跟踪空文件夹, 若已删除示例内容
      # 该目录在 checkout 后可能根本不存在, 需要 mkdir -p 兜底)。
      - name: 准备内容目录
        run: |
          mkdir -p src/content/notes src/content/news
          rm -rf src/content/notes/* src/content/news/*

      # 笔记仓库整体拉到临时目录, 仓库内部约定用 notes/ 和 news/ 两个子目录分类。
      # TODO: 替换 repository 为你的笔记仓库 (如 your-name/portfolio-notes)。
      # 若笔记仓库是私有的, 需配置带 repo 权限的 PAT 并在此传入 token。
      - name: Checkout 笔记仓库
        uses: actions/checkout@v4
        with:
          repository: your-name/portfolio-notes
          path: _notes-source
          # token: ${{ secrets.NOTES_REPO_TOKEN }}   # 私有仓库时取消注释

      # 把笔记仓库的 notes/ 和 news/ 子目录分别注入网站对应的 content 目录
      - name: 注入 notes 与 news 内容
        run: |
          shopt -s nullglob dotglob
          notes_files=(_notes-source/notes/*)
          if [ ${#notes_files[@]} -gt 0 ]; then
            cp -r _notes-source/notes/. src/content/notes/
          else
            echo "警告: 笔记仓库中未找到 notes/ 目录或目录为空"
          fi
          news_files=(_notes-source/news/*)
          if [ ${#news_files[@]} -gt 0 ]; then
            cp -r _notes-source/news/. src/content/news/
          else
            echo "警告: 笔记仓库中未找到 news/ 目录或目录为空"
          fi
          rm -rf _notes-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro + Pagefind 索引)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
