<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="16" fill="#0f1420"/>

  <text x="40" y="52" fill="#fbbf24" font-size="15" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">NOTES REPO → SITE</text>

  <!-- row 1 -->
  <g>
    <rect x="40" y="90" width="320" height="110" rx="12" fill="#161b2e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="64" y="128" fill="#2dd4bf" font-size="14" font-family="'JetBrains Mono', monospace">01</text>
    <text x="64" y="158" fill="#e6edf3" font-size="20" font-weight="600">推送笔记</text>
    <text x="64" y="184" fill="#8b949e" font-size="14">my-note 发出 content-updated</text>

    <rect x="440" y="90" width="320" height="110" rx="12" fill="#161b2e" stroke="#30363d" stroke-width="1.5"/>
    <text x="464" y="128" fill="#2dd4bf" font-size="14" font-family="'JetBrains Mono', monospace">02</text>
    <text x="464" y="158" fill="#e6edf3" font-size="20" font-weight="600">稀疏检出</text>
    <text x="464" y="184" fill="#8b949e" font-size="14">只拉 *_SOURCES 列出的文件夹</text>

    <rect x="840" y="90" width="320" height="110" rx="12" fill="#161b2e" stroke="#30363d" stroke-width="1.5"/>
    <text x="864" y="128" fill="#2dd4bf" font-size="14" font-family="'JetBrains Mono', monospace">03</text>
    <text x="864" y="158" fill="#e6edf3" font-size="20" font-weight="600">注入内容</text>
    <text x="864" y="184" fill="#8b949e" font-size="14">复制进 src/content/*</text>
  </g>
  <line x1="364" y1="145" x2="434" y2="145" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="764" y1="145" x2="834" y2="145" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- turn -->
  <path d="M1000 204 L1000 240 L200 240 L200 276" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- row 2 -->
  <g>
    <rect x="40" y="282" width="320" height="110" rx="12" fill="#161b2e" stroke="#30363d" stroke-width="1.5"/>
    <text x="64" y="320" fill="#2dd4bf" font-size="14" font-family="'JetBrains Mono', monospace">04</text>
    <text x="64" y="350" fill="#e6edf3" font-size="20" font-weight="600">挡掉坏文件</text>
    <text x="64" y="376" fill="#8b949e" font-size="14">frontmatter 不合格就移除</text>

    <rect x="440" y="282" width="320" height="110" rx="12" fill="#161b2e" stroke="#30363d" stroke-width="1.5"/>
    <text x="464" y="320" fill="#2dd4bf" font-size="14" font-family="'JetBrains Mono', monospace">05</text>
    <text x="464" y="350" fill="#e6edf3" font-size="20" font-weight="600">构建 + 索引</text>
    <text x="464" y="376" fill="#8b949e" font-size="14">astro build → pagefind</text>

    <rect x="840" y="282" width="320" height="110" rx="12" fill="#161b2e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="864" y="320" fill="#2dd4bf" font-size="14" font-family="'JetBrains Mono', monospace">06</text>
    <text x="864" y="350" fill="#e6edf3" font-size="20" font-weight="600">部署上线</text>
    <text x="864" y="376" fill="#8b949e" font-size="14">GitHub Pages</text>
  </g>
  <line x1="364" y1="337" x2="434" y2="337" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="764" y1="337" x2="834" y2="337" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
</svg>
